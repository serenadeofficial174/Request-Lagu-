<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sawer & Request Lagu</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f2f2f2;
  color: #222;
}

.container {
  max-width: 450px;
  margin: auto;
  padding: 25px 18px;
  text-align: center;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.1);
}

h1 {
  margin-top: 0;
}

.qris {
  width: 220px;
  height: 220px;
  object-fit: contain;
  border-radius: 10px;
  background: #eee;
  margin: 15px auto;
  display: block;
}

.nominal {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 15px 0;
}

.nominal button {
  padding: 13px;
  border: 2px solid #ddd;
  background: white;
  border-radius: 10px;
  font-weight: bold;
  cursor: pointer;
}

.nominal button.active {
  background: #111;
  color: white;
  border-color: #111;
}

.bayar {
  width: 100%;
  padding: 15px;
  margin-top: 10px;
  border: none;
  border-radius: 12px;
  background: #111;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

input {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 15px;
}

.whatsapp {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: none;
  border-radius: 12px;
  background: #25D366;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.note {
  font-size: 13px;
  color: #777;
  margin-top: 15px;
}

.hidden {
  display: none;
}

.success {
  background: #e8f8ee;
  padding: 12px;
  border-radius: 10px;
  margin: 15px 0;
  color: #16803c;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <h1>🎵 Sawer & Request Lagu</h1>

    <p>Pilih nominal saweran terlebih dahulu.</p>

    <div class="nominal">
      <button onclick="pilihNominal(10000, this)">Rp10.000</button>
      <button onclick="pilihNominal(20000, this)">Rp20.000</button>
      <button onclick="pilihNominal(50000, this)">Rp50.000</button>
      <button onclick="pilihNominal(100000, this)">Rp100.000</button>
    </div>

    <div id="pembayaran" class="hidden">

      <h3>💳 Bayar melalui QRIS</h3>

      <p>
        Silakan scan QRIS di bawah sesuai nominal yang kamu pilih.
      </p>

      <img
        class="qris"
        src="IMG_20260812_020258.png"
        alt="QRIS"
      >

      <p>
        <b>Nominal: <span id="nominalText"></span></b>
      </p>

      <button class="bayar" onclick="sudahBayar()">
        ✅ Saya Sudah Bayar
      </button>

    </div>

    <div id="requestForm" class="hidden">

      <div class="success">
        ✅ Terima kasih! Silakan isi request lagu.
      </div>

      <input
        type="text"
        id="nama"
        placeholder="Nama yang request"
      >

      <input
        type="text"
        id="lagu"
        placeholder="Judul lagu"
      >

      <button class="whatsapp" onclick="kirimWhatsApp()">
        📲 Kirim Request ke WhatsApp
      </button>

    </div>

    <div class="note">
      Request lagu hanya dapat dikirim setelah melakukan saweran.
    </div>

  </div>
</div>

<script>

let nominal = 0;

function pilihNominal(jumlah, tombol) {

  nominal = jumlah;

  document.querySelectorAll(".nominal button")
    .forEach(btn => btn.classList.remove("active"));

  tombol.classList.add("active");

  document.getElementById("pembayaran")
    .classList.remove("hidden");

  document.getElementById("requestForm")
    .classList.add("hidden");

  document.getElementById("nominalText").innerText =
    "Rp" + jumlah.toLocaleString("id-ID");

  document.getElementById("pembayaran")
    .scrollIntoView({
      behavior: "smooth"
    });
}


function sudahBayar() {

  if (nominal === 0) {
    alert("Silakan pilih nominal terlebih dahulu.");
    return;
  }

  document.getElementById("requestForm")
    .classList.remove("hidden");

  document.getElementById("requestForm")
    .scrollIntoView({
      behavior: "smooth"
    });
}


function kirimWhatsApp() {

  const nama =
    document.getElementById("nama").value.trim();

  const lagu =
    document.getElementById("lagu").value.trim();

  if (nama === "") {
    alert("Silakan isi nama.");
    return;
  }

  if (lagu === "") {
    alert("Silakan isi judul lagu.");
    return;
  }

  if (nominal === 0) {
    alert("Silakan pilih nominal saweran.");
    return;
  }

  const pesan =
`🎵 REQUEST LAGU

Nama: ${nama}
Judul Lagu: ${lagu}
Nominal Saweran: Rp${nominal.toLocaleString("id-ID")}

Saya sudah melakukan saweran melalui QRIS.`;

  const nomor = "6285122961465";

  const url =
    "https://wa.me/" +
    nomor +
    "?text=" +
    encodeURIComponent(pesan);

  window.open(url, "_blank");
}

</script>

</body>
</html>
